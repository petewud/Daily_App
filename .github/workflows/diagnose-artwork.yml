name: Diagnose artwork
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow numpy
      - run: python scripts/diagnose_artwork.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artwork-diagnostics
          path: artwork/diagnostics
          if-no-files-found: error
