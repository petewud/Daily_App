name: Build A Day To Keep
'on':
  workflow_dispatch: {}
  push:
    paths:
    - LittleDays.zip
    - update_app.py
    - update_style.py
    - update_refine.py
    - fix_pdf.py
    - update_polish.py
    - fix_writing.py
    - update_round.py
    - update_preferences.py
    - update_bloom.py
    - update_studio.py
    - update_edgefix.py
    - update_comfort.py
    - fix_calendar.py
    - .github/workflows/build-apk.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
    - name: Install Android build tools
      run: |
        sdkmanager "platforms;android-35" "build-tools;35.0.0"
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Extract existing project
      run: |
        for file in LittleDays.zip update_polish.py fix_writing.py update_round.py update_preferences.py update_bloom.py update_studio.py update_edgefix.py update_comfort.py fix_calendar.py; do
          test -f "$file" || { echo "Missing repository file: $file"; exit 1; }
        done
        mkdir -p android-project
        unzip -q LittleDays.zip -d android-project
        test -f android-project/settings.gradle
        echo "sdk.dir=$ANDROID_HOME" > android-project/local.properties
    - name: Prepare the working version 5 if needed
      run: |
        source=app/src/main/java/uk/co/littledays/MainActivity.java
        if grep -q A_DAY_TO_KEEP_V6 "$source"; then
          echo "Complete version 6 source: no earlier update steps needed."
        elif grep -q A_DAY_TO_KEEP_V5 "$source"; then
          echo "Complete version 5 source: ready for the new update."
        else
          for file in update_app.py update_style.py update_refine.py fix_pdf.py; do
            test -f "../$file" || { echo "Missing repository file: $file"; exit 1; }
            python3 "../$file"
          done
        fi
      working-directory: android-project
      shell: bash
    - name: Preserve layout, artwork and checklist widget
      run: |
        python3 ../update_polish.py
      working-directory: android-project
    - name: Preserve the working journal keyboard repair
      run: |
        python3 ../fix_writing.py
      working-directory: android-project
    - name: Preserve clipping, collision-safe motion and radial widget
      run: |
        python3 ../update_round.py
      working-directory: android-project
    - name: Preserve theme preferences and both widget variants
      run: |
        python3 ../update_preferences.py
      working-directory: android-project
    - name: Preserve version 6.4 themes and artwork
      run: |
        python3 ../update_bloom.py
      working-directory: android-project
    - name: Preserve the studio update
      run: |
        python3 ../update_studio.py
      working-directory: android-project
    - name: Preserve the working edge-to-edge crash repair
      run: |
        python3 ../update_edgefix.py
      working-directory: android-project
    - name: Preserve version 7.1 notes, controls, notifications and themes
      run: |
        python3 ../update_comfort.py
      working-directory: android-project
    - name: Repair Unicode calendar arrow direction and labels
      run: |
        python3 ../fix_calendar.py
      working-directory: android-project
    - name: Validate startup, UI updates and both calendar directions
      run: "python3 - <<'PY'\nfrom pathlib import Path\nsource=Path('app/src/main/java/uk/co/littledays/MainActivity.java').read_text()\n\
        assert '// A_DAY_TO_KEEP_EDGEFIX_703' in source\nassert '// A_DAY_TO_KEEP_COMFORT_71' in source\nassert\
        \ '// A_DAY_TO_KEEP_CALENDAR_711' in source\nassert 'w.getDecorView().post(() -> {' in source\nassert 'if(controller!=null)controller.setSystemBarsAppearance'\
        \ in source\nassert source.count('new ThemeSpec(') >= 43\nassert 'class NoteBoard extends ViewGroup' in\
        \ source\nassert 'startDragAndDrop(' in source and 'noteOrder' in source\nassert 'class RoundedTimeWheel\
        \ extends NumberPicker' in source\nassert Path('app/src/main/res/drawable/ic_notification_bunny.xml').is_file()\n\
        assert any('.setSmallIcon(uk.co.littledays.R.drawable.ic_notification_bunny)' in f.read_text() for f in\
        \ Path('app/src/main/java/uk/co/littledays').glob('*.java'))\nassert 'boolean previous=symbol.equals(\"\
        <\")||symbol.equals(\"\u2039\");' in source\nassert 'setContentDescription(previous?\"Previous month\":\"\
        Next month\")' in source\nassert 'new CalendarChevron(previous)' in source\nfor symbol,expected in [('<',True),('\u2039\
        ',True),('>',False),('\u203A',False)]:\n    assert (symbol=='<' or symbol=='\u2039')==expected\nPY\n"
      working-directory: android-project
    - name: Build updated APK
      run: |
        gradle --no-daemon --stacktrace assembleDebug
      working-directory: android-project
    - name: Enable emulator acceleration
      run: |
        if [ ! -e /dev/kvm ]; then
          echo "This runner does not expose /dev/kvm. Use GitHub's standard ubuntu-latest runner."
          exit 1
        fi
        sudo chmod 666 /dev/kvm
    - name: Test startup, calendars, journal, theme dropdown and widget registration
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        emulator-boot-timeout: 600
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
        script: |
          adb wait-for-device
          sleep 15
          python3 android-project/tools/smoke_test.py
    - name: Upload startup screenshots and diagnostic logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: A-Day-To-Keep-Startup-Diagnostics
        path: startup-diagnostics/
        if-no-files-found: ignore
        retention-days: 14
    - name: Upload installable APK after successful launch test
      uses: actions/upload-artifact@v4
      with:
        name: A-Day-To-Keep-APK
        path: android-project/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        retention-days: 30
    - name: Package complete updated source
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import zipfile, shutil
        root=Path('android-project')
        for name in ('update_app.py','update_style.py','update_refine.py','fix_pdf.py','update_polish.py','fix_writing.py','update_round.py','update_preferences.py','update_bloom.py','update_studio.py','update_edgefix.py','update_comfort.py','fix_calendar.py'):
            if Path(name).is_file():
                shutil.copy2(name,root/name)
        (root/'.github/workflows').mkdir(parents=True,exist_ok=True)
        shutil.copy2('.github/workflows/build-apk.yml',root/'.github/workflows/build-apk.yml')
        Path('updated-source').mkdir(exist_ok=True)
        with zipfile.ZipFile('updated-source/LittleDays.zip','w',zipfile.ZIP_DEFLATED) as archive:
            for p in root.rglob('*'):
                if not p.is_file():
                    continue
                relative=p.relative_to(root)
                if any(part in ('build','.gradle','.idea') for part in relative.parts) or relative.name=='local.properties':
                    continue
                archive.write(p,relative.as_posix())
        with zipfile.ZipFile('updated-source/LittleDays.zip') as archive:
            assert archive.testzip() is None
            assert 'signing/personal.p12' in archive.namelist()
            assert 'app/src/main/java/uk/co/littledays/KeepCountWidget.java' in archive.namelist()
            source=archive.read('app/src/main/java/uk/co/littledays/MainActivity.java')
            assert b'A_DAY_TO_KEEP_EDGEFIX_703' in source
            assert b'A_DAY_TO_KEEP_COMFORT_71' in source
            assert b'A_DAY_TO_KEEP_CALENDAR_711' in source
        PY
    - name: Upload complete updated project
      uses: actions/upload-artifact@v4
      with:
        name: A-Day-To-Keep-Updated-Project-PRIVATE
        path: updated-source/LittleDays.zip
        if-no-files-found: error
        retention-days: 30
