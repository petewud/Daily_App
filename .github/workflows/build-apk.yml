name: Build Little Days APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LittleDays.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          test -f LittleDays.zip || { echo "Upload LittleDays.zip to the repository root first."; exit 1; }
          mkdir -p android-project
          unzip -q LittleDays.zip -d android-project
          test -f android-project/settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > android-project/local.properties

      - name: Fix Android API compatibility
        working-directory: android-project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/uk/co/littledays/MainActivity.java")
          s = p.read_text(encoding="utf-8")
          fixes = [
              (
                  'java.nio.file.Files.readString(new File(staging,"data.json").toPath())',
                  'new String(java.nio.file.Files.readAllBytes(new File(staging,"data.json").toPath()), java.nio.charset.StandardCharsets.UTF_8)',
              ),
              (
                  'try(android.graphics.pdf.PdfDocument pdf=new android.graphics.pdf.PdfDocument()){',
                  'android.graphics.pdf.PdfDocument pdf=new android.graphics.pdf.PdfDocument();try{',
              ),
              (
                  'w.finish();pdf.writeTo(out);}}',
                  'w.finish();pdf.writeTo(out);}finally{pdf.close();}}',
              ),
          ]
          for old, new in fixes:
              if old in s:
                  if s.count(old) != 1:
                      raise SystemExit("Unexpected source layout; refusing an ambiguous replacement")
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit("Project source differs from the expected version; cannot safely apply fix")
          p.write_text(s, encoding="utf-8")
          print("Applied both Android API compatibility fixes.")
          PY

      - name: Build APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Little-Days-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
