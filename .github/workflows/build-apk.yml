name: Build A Day To Keep

on:
  workflow_dispatch:
  push:
    paths:
      - 'LittleDays.zip'
      - 'update_app.py'
      - 'update_style.py'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract existing project
        run: |
          test -f LittleDays.zip || { echo "Keep LittleDays.zip in the repository root."; exit 1; }
          test -f update_app.py || { echo "Keep your existing update_app.py in the repository root."; exit 1; }
          test -f update_style.py || { echo "Upload update_style.py to the repository root."; exit 1; }
          mkdir -p android-project
          unzip -q LittleDays.zip -d android-project
          test -f android-project/settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > android-project/local.properties

      - name: Prepare existing version 2 source
        working-directory: android-project
        run: python3 ../update_app.py

      - name: Apply version 3 artwork and layout update
        working-directory: android-project
        run: python3 ../update_style.py

      - name: Build updated APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: A-Day-To-Keep-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package complete updated source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, shutil
          root=Path('android-project')
          for name in ('update_app.py','update_style.py'):
              shutil.copy2(name,root/name)
          (root/'.github/workflows').mkdir(parents=True,exist_ok=True)
          shutil.copy2('.github/workflows/build-apk.yml',root/'.github/workflows/build-apk.yml')
          Path('updated-source').mkdir(exist_ok=True)
          with zipfile.ZipFile('updated-source/LittleDays.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if not p.is_file():
                      continue
                  rel=p.relative_to(root)
                  if any(part in ('build','.gradle','.idea') for part in rel.parts) or rel.name=='local.properties':
                      continue
                  z.write(p,rel.as_posix())
          with zipfile.ZipFile('updated-source/LittleDays.zip') as z:
              assert z.testzip() is None
              assert 'signing/personal.p12' in z.namelist()
              assert b'A_DAY_TO_KEEP_V3' in z.read('app/src/main/java/uk/co/littledays/MainActivity.java')
          PY

      - name: Upload complete updated project
        uses: actions/upload-artifact@v4
        with:
          name: A-Day-To-Keep-Updated-Project-PRIVATE
          path: updated-source/LittleDays.zip
          if-no-files-found: error
          retention-days: 30
