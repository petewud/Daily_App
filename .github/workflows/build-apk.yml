name: Build A Day To Keep

on:
  workflow_dispatch:
  push:
    paths:
      - 'LittleDays.zip'
      - 'update_app.py'
      - 'update_style.py'
      - 'update_refine.py'
      - 'fix_pdf.py'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract existing project
        run: |
          for file in LittleDays.zip fix_pdf.py; do
            test -f "$file" || { echo "Missing repository file: $file"; exit 1; }
          done
          mkdir -p android-project
          unzip -q LittleDays.zip -d android-project
          test -f android-project/settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > android-project/local.properties

      - name: Prepare previous changes if needed
        shell: bash
        working-directory: android-project
        run: |
          if grep -q A_DAY_TO_KEEP_V5 app/src/main/java/uk/co/littledays/MainActivity.java; then
            echo "Using complete version 5 project; no earlier patch steps needed."
          else
            for file in update_app.py update_style.py update_refine.py; do
              test -f "../$file" || { echo "Missing repository file: $file"; exit 1; }
              python3 "../$file"
            done
          fi

      - name: Apply startup repair and PDF attachments
        working-directory: android-project
        run: python3 ../fix_pdf.py

      - name: Make emulator smoke test resilient to Pixel Launcher ANR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast
          path = Path('android-project/tools/smoke_test.py')
          source = path.read_text(encoding='utf-8')
          marker = '# PIXEL_LAUNCHER_TEST_RECOVERY_V1'
          wrapper = '_launcher_recoveries = 0\n\ndef hierarchy(name):\n global _launcher_recoveries\n for attempt in range(3):\n  tree = raw_hierarchy(name)\n  try:\n   screenshot(name + \'-observed-\' + str(attempt))\n  except Exception as error:\n   print(\'Could not capture screenshot:\', error)\n  texts = \' \'.join(n.get(\'text\', \'\') for n in tree.iter(\'node\'))\n  launcher_dialog = "Pixel Launcher isn\'t responding" in texts or \'Pixel Launcher isn’t responding\' in texts\n  if not launcher_dialog:\n   return tree\n  # Only this specifically identified SYSTEM launcher failure may be recovered.\n  # Never close/ignore an ANR for A Day To Keep or accept its crash-report screen.\n  ET.ElementTree(tree).write(out / (name + \'-pixel-launcher-anr-\' + str(attempt) + \'.xml\'), encoding=\'utf-8\', xml_declaration=True)\n  if _launcher_recoveries >= 2:\n   raise RuntimeError(\'Pixel Launcher repeatedly stopped responding; emulator environment is not healthy\')\n  close = next((node for node in tree.iter(\'node\') if node.get(\'resource-id\') == \'android:id/aerr_close\'), None)\n  if close is None:\n   raise RuntimeError(\'Pixel Launcher ANR detected, but Close app button was not found\')\n  bounds = [int(x) for x in re.findall(r\'\\d+\', close.get(\'bounds\', \'\'))]\n  if len(bounds) != 4:\n   raise RuntimeError(\'Cannot read Pixel Launcher dialog button bounds\')\n  _launcher_recoveries += 1\n  print(\'Recovering emulator Pixel Launcher ANR; recovery\', _launcher_recoveries)\n  with (out / \'launcher-recovery.txt\').open(\'a\') as report:\n   report.write(name + \': closed Pixel Launcher ANR and relaunched target activity\\n\')\n  adb(\'shell\', \'input\', \'tap\', str((bounds[0] + bounds[2]) // 2), str((bounds[1] + bounds[3]) // 2))\n  time.sleep(3)\n  result = adb(\'shell\', \'am\', \'start\', \'-W\', \'-n\', package + \'/.MainActivity\')\n  (out / (name + \'-relaunch-\' + str(attempt) + \'.txt\')).write_text(result)\n  if \'Error:\' in result or \'Exception\' in result:\n   raise RuntimeError(\'Could not relaunch target app: \' + result)\n  time.sleep(6)\n  alive()\n raise RuntimeError(\'Could not recover emulator launcher dialog\')\n\n'
          if marker not in source:
              if source.count('def hierarchy(name):') != 1 or 'def screenshot(name):' not in source:
                  raise SystemExit('Unexpected smoke test layout. Refusing to modify an unknown test.')
              source = source.replace('def hierarchy(name):', 'def raw_hierarchy(name):', 1)
              source = source.replace('def screenshot(name):', marker + '\n' + wrapper + 'def screenshot(name):', 1)
              ast.parse(source)
              path.write_text(source, encoding='utf-8')
          print('Smoke test retains all app checks, records screens before assertions, and recovers only Pixel Launcher ANRs.')
          PY

      - name: Build updated APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Enable emulator acceleration
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "This runner does not expose /dev/kvm. Use GitHub's standard ubuntu-latest runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm

      - name: Test actual app startup and navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb wait-for-device
            sleep 15
            python3 android-project/tools/smoke_test.py

      - name: Upload startup screenshots and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Day-To-Keep-Startup-Diagnostics
          path: startup-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installable APK after successful launch test
        uses: actions/upload-artifact@v4
        with:
          name: A-Day-To-Keep-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package complete updated source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, shutil
          root=Path('android-project')
          for name in ('update_app.py','update_style.py','update_refine.py','fix_pdf.py'):
              if Path(name).is_file():
                  shutil.copy2(name,root/name)
          (root/'.github/workflows').mkdir(parents=True,exist_ok=True)
          shutil.copy2('.github/workflows/build-apk.yml',root/'.github/workflows/build-apk.yml')
          Path('updated-source').mkdir(exist_ok=True)
          with zipfile.ZipFile('updated-source/LittleDays.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for p in root.rglob('*'):
                  if not p.is_file():
                      continue
                  relative=p.relative_to(root)
                  if any(part in ('build','.gradle','.idea') for part in relative.parts) or relative.name=='local.properties':
                      continue
                  archive.write(p,relative.as_posix())
          with zipfile.ZipFile('updated-source/LittleDays.zip') as archive:
              assert archive.testzip() is None
              assert 'signing/personal.p12' in archive.namelist()
              assert b'A_DAY_TO_KEEP_V5' in archive.read('app/src/main/java/uk/co/littledays/MainActivity.java')
          PY

      - name: Upload complete updated project
        uses: actions/upload-artifact@v4
        with:
          name: A-Day-To-Keep-Updated-Project-PRIVATE
          path: updated-source/LittleDays.zip
          if-no-files-found: error
          retention-days: 30
