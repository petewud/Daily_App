name: Process artwork v3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow numpy scipy
      - run: python scripts/process_artwork_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-artwork-v3
          path: artwork/output-v3
          if-no-files-found: error
